services:
  immich-network-storage-api:
    build:
      context: /omv/apps-compose/immich-network-storage/repo
      dockerfile: Dockerfile
      network: host
    container_name: immich-network-storage-api
    user: 82:82
    env_file:
      - .env
    ports:
      - "22832:22" # SFTP
      - "22100:21" # FTP
      - "19000:1900" # WebDAV
    volumes:
      - /omv/apps-compose/immich-network-storage/data:/data
      - /omv/apps-compose/immich-network-storage/config:/config
    restart: unless-stopped
